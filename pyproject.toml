[project]
name = "ocproject7bis"
version = "0.1.0"
description = "Projet 7 du cursus AI Engineer d'OpenClassrooms. Projet centré sur la gestion de RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.11.0",
    "bs4>=0.0.2",
    "flagembedding>=1.4.2",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "llm: calls the Anthropic API (costs credits), run with -m llm",
    "db: needs the database and the BGE-M3 model, run with -m db",
]
addopts = "-m 'not llm and not db'"
asyncio_default_fixture_loop_scope = "function"
